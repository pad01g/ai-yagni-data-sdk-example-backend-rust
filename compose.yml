# 全体を手元で動かす（make up）。http://localhost:8080
#
# ネットワークを 3 つに分ける。backend からは MySQL にも決済サービスにも届かない。
#   edge: frontend（nginx）と backend。frontend だけがホストにポートを開く
#   app:  backend と proxy（gRPC）。外へは出られない
#   data: proxy と MySQL と決済サービス（と、スキーマを当てる Atlas と代表データ）。外へは出られない
name: ai-yagni-shop

services:
  mysql:
    image: mysql:8.4.6
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_bin]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysql, -h127.0.0.1, -uroot, -proot, -e, SELECT 1]
      interval: 2s
      retries: 90
    networks: [data]

  # SE の作業: Atlas が schema.sql を今の DB との差分として当てる
  schema:
    image: arigaio/atlas:1.3.4-community
    command:
      - schema
      - apply
      - --url=mysql://root:root@mysql:3306/shop
      - --to=file:///schema/schema.sql
      - --dev-url=mysql://root:root@mysql:3306/atlas_dev
      - --auto-approve
    volumes:
      - ./schema.sql:/schema/schema.sql:ro
    depends_on:
      mysql: { condition: service_healthy }
    networks: [data]

  # SE の作業: 商品がまだなければ代表データを入れる
  seed:
    image: mysql:8.4.6
    entrypoint:
      - sh
      - -c
      - |
        n=$$(mysql -hmysql -uroot -proot -N -e 'SELECT COUNT(*) FROM shop.products')
        if [ "$$n" = 0 ]; then mysql -hmysql -uroot -proot --default-character-set=utf8mb4 shop < /fixtures/0001_shop.sql; fi
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      schema: { condition: service_completed_successfully }
    networks: [data]

  payment:
    build: ./submodules/payment
    networks: [data]

  proxy:
    build: ./submodules/proxy
    environment:
      DATABASE_URL: mysql://proxy:proxy@mysql:3306/shop
      PAYMENT_URL: http://payment:8080
    depends_on:
      seed: { condition: service_completed_successfully }
      payment: { condition: service_started }
    networks: [data, app]

  backend:
    build: .
    environment:
      PROXY_URL: http://proxy:50051
      SESSION_SECRET: local-development-only
    depends_on: [proxy]
    networks: [app, edge]

  frontend:
    build: ./submodules/frontend
    ports: ["8080:8080"]
    depends_on: [backend]
    networks: [edge]

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }

volumes:
  mysql-data: {}
