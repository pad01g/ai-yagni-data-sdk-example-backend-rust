# 全体を手元で動かす（make up）。http://localhost:8080
#
# 秘密（DB のパスワード、セッションの鍵）は .env に置き、リポジトリには入れない。make up が初回に乱数で作る。
#
# ネットワークを 5 つに分ける。backend からは MySQL にも決済サービスにも届かず、外へも出られない。
#   public:  frontend（nginx）だけ。ホストの 127.0.0.1:8080 にだけ開く
#   edge:    frontend と backend。外へは出られない
#   app:     backend と proxy（gRPC）。外へは出られない
#   data:    proxy と MySQL（と、スキーマを当てる Atlas と代表データ）。外へは出られない
#   payment: proxy と決済サービス。外へは出られない（決済サービスから MySQL には届かない）
name: ai-yagni-shop

x-mysql-root: &mysql-root
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run make env}

services:
  mysql:
    image: mysql:8.4.6
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_bin]
    environment:
      <<: *mysql-root
      MYSQL_DATABASE: shop
      PROXY_DB_PASSWORD: ${PROXY_DB_PASSWORD:?run make env}
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql -h127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1"']
      interval: 2s
      retries: 90
    restart: unless-stopped
    networks: [data]

  # SE の作業: Atlas が schema.sql を今の DB との差分として当てる
  schema:
    image: arigaio/atlas:1.3.4-community
    # パスワードは引数に出さず、atlas.hcl が環境変数から読む
    command: [schema, apply, --config, file:///schema/atlas.hcl, --env, compose, --auto-approve]
    environment: *mysql-root
    volumes:
      - ./schema.sql:/schema/schema.sql:ro
      - ./docker/atlas/atlas.hcl:/schema/atlas.hcl:ro
    depends_on:
      mysql: { condition: service_healthy }
    networks: [data]

  # SE の作業: proxy の権限を当て直し（表と列の単位なので、スキーマの後に毎回。前の権限は一度すべて取り上げる）、
  # 商品がまだなければ代表データを入れる
  seed:
    image: mysql:8.4.6
    environment: *mysql-root
    entrypoint:
      - sh
      - -c
      - |
        set -e
        q() { mysql -hmysql -uroot -p"$$MYSQL_ROOT_PASSWORD" --default-character-set=utf8mb4 "$$@"; }
        q -e "REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'proxy'@'%'"
        q < /grants.sql
        n=$$(q -N -e 'SELECT COUNT(*) FROM shop.products')
        if [ "$$n" = 0 ]; then for f in /fixtures/*.sql; do q shop < "$$f"; done; fi
    volumes:
      - ./fixtures:/fixtures:ro
      - ./submodules/proxy/grants.sql:/grants.sql:ro
    depends_on:
      schema: { condition: service_completed_successfully }
    networks: [data]

  payment:
    build: ./submodules/payment
    init: true
    volumes:
      - payment-data:/data
    restart: unless-stopped
    networks: [payment]

  proxy:
    build: ./submodules/proxy
    init: true
    environment:
      DATABASE_URL: mysql://proxy:${PROXY_DB_PASSWORD}@mysql:3306/shop
      PAYMENT_URL: http://payment:8080
      SESSION_SECRET: ${SESSION_SECRET:?run make env}
    depends_on:
      seed: { condition: service_completed_successfully }
      payment: { condition: service_started }
    restart: unless-stopped
    networks: [data, payment, app]

  backend:
    build: .
    init: true
    environment:
      PROXY_URL: http://proxy:50051
      # 手元は http なので Secure を付けない（https で配るときは消す）
      COOKIE_SECURE: "0"
    depends_on: [proxy]
    restart: unless-stopped
    networks: [app, edge]

  frontend:
    build: ./submodules/frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
    restart: unless-stopped
    networks: [public, edge]

networks:
  public: {}
  edge: { internal: true }
  app: { internal: true }
  data: { internal: true }
  payment: { internal: true }

volumes:
  mysql-data: {}
  payment-data: {}
