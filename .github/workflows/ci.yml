name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - run: make lint test proxy-schema
      - name: Atlas（schema.sql が当たり、差分が残らず、壊しうる変更がなく、前のデータの上で当たる）
        env:
          # PR は向かう先のブランチ、main への push は push の前のコミットと比べる
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # push の前のコミットが無い（新しいブランチ）か、force push で辿れなければ、1 つ前と比べる。
          # それも無ければ（最初のコミット）、比べずに 1 と 2 だけを確かめる
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::warning::BASE=$BASE をたどれないので、1 つ前のコミットと比べる"
            BASE=HEAD~1
          fi
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            BASE=HEAD
          fi
          make schema BASE="$BASE"
      - name: データの未来の検査
        run: make futures
      - name: データの未来の検査（共変更を含む）
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: make futures-pr BASE="$BASE"

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify

  # 全体を compose で立て、HTTP で端から端まで試す
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: make up
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: make down
