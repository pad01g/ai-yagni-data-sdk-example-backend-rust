[package]
name = "shop"
description = "EC サイトを模した簡易的なバックエンド（HTTP + JSON）。データはすべて backend-proxy を通す"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
shop-proxy-api.workspace = true
shop-verified = { path = "../verified" }
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
